<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Evently</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#2b1f24">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon-192.png">
  <style>
    /* Design tokens and theme variants. */
    :root {
      --bg: #faf7f5;
      --sf: #fff;
      --tx: #2a2320;
      --mu: #7a6f69;
      --ac: #9b4d63;
      --ac2: #f4e4e9;
      --bd: #e8dfda;
      --ok: #2e7d5b;
      --wa: #b8700f;
      --er: #b3382c;
      --nv: #2b1f24;
      --ni: #ecdde2;
      color-scheme: light;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px)
    }

    @media (prefers-color-scheme:dark) {
      :root:not([data-theme="light"]) {
        --bg: #1b1617;
        --sf: #272021;
        --tx: #f1e9e6;
        --mu: #a99d98;
        --ac: #e08aa3;
        --ac2: #3a2830;
        --bd: #3a3032;
        --ok: #5cc496;
        --wa: #e5a64d;
        --er: #ef7b6e;
        --nv: #110c0e;
        --ni: #ecdde2;
        color-scheme: dark
      }
    }

    :root[data-theme="dark"] {
      --bg: #1b1617;
      --sf: #272021;
      --tx: #f1e9e6;
      --mu: #a99d98;
      --ac: #e08aa3;
      --ac2: #3a2830;
      --bd: #3a3032;
      --ok: #5cc496;
      --wa: #e5a64d;
      --er: #ef7b6e;
      --nv: #110c0e;
      --ni: #ecdde2;
      color-scheme: dark
    }

    * {
      box-sizing: border-box
    }

    /* Base typography and page layout. */
    html,
    body {
      margin: 0
    }

    body {
      background: var(--bg);
      color: var(--tx);
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding-bottom: 84px
    }

    h2,
    h3 {
      margin: 0
    }

    h2 {
      font-size: 1.3rem
    }

    h3 {
      font-size: 1.05rem
    }

    p {
      margin: .3rem 0
    }

    header {
      padding: 14px 16px;
      font-weight: 700;
      color: var(--ac);
      font-size: 1.15rem;
      border-bottom: 1px solid var(--bd);
      background: var(--sf)
    }

    header small {
      color: var(--mu);
      font-weight: 400;
      margin-left: 6px
    }

    #main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px
    }

    /* Primary navigation: bottom bar on mobile and sidebar on desktop. */
    #nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      background: var(--nv);
      border-top: 1px solid #0003;
      padding: 4px 4px calc(4px + env(safe-area-inset-bottom, 0px));
      z-index: 20
    }

    #nav button {
      flex: 1;
      border: 0;
      background: none;
      color: var(--ni);
      font: inherit;
      font-size: .66rem;
      padding: 6px 2px;
      border-radius: 10px;
      cursor: pointer
    }

    #nav button .ic {
      display: block;
      margin: 0 auto 2px
    }

    #nav button.on {
      color: #fff;
      background: var(--ac);
      font-weight: 600
    }

    .ic {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    @media(min-width:800px) {
      body {
        padding: 0 0 0 190px
      }

      header {
        margin-left: -190px;
        padding-left: 206px
      }

      #nav {
        top: 0;
        right: auto;
        width: 190px;
        flex-direction: column;
        border-top: 0;
        border-right: 0;
        padding: 12px 10px 10px
      }

      #nav button {
        flex: none;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: .92rem;
        text-align: left;
        height: 38px;
        padding: 0 12px;
        margin-bottom: 2px
      }

      #nav button .ic {
        display: inline;
        margin: 0;
        width: 20px;
        height: 20px
      }

      #nav .logo {
        display: flex
      }

      .hl {
        display: none
      }

      body.out {
        padding: 0
      }

      body.out header {
        margin: 0;
        padding-left: 16px
      }
    }

    /* Shared cards, rows, buttons, badges, and form controls. */
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin: 14px 0 8px;
      flex-wrap: wrap
    }

    .card,
    .item {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px
    }

    .item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px
    }

    .item small {
      display: block;
      color: var(--mu)
    }

    .item.click {
      cursor: pointer
    }

    .acts {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      flex-wrap: wrap;
      justify-content: flex-end
    }

    .btn {
      border: 1px solid var(--bd);
      background: var(--sf);
      color: var(--tx);
      border-radius: 9px;
      padding: 8px 12px;
      font: inherit;
      font-size: .9rem;
      cursor: pointer;
      min-height: 40px
    }

    .btn.pri {
      background: var(--ac);
      border-color: var(--ac);
      color: #fff
    }

    .btn.dng {
      color: var(--er)
    }

    .btn.ok {
      color: var(--ok);
      border-color: var(--ok)
    }

    .btn.wa {
      color: var(--wa);
      border-color: var(--wa)
    }

    .btn.big {
      min-height: 48px;
      min-width: 112px;
      font-weight: 600
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
      margin-bottom: 6px
    }

    .stat {
      background: var(--sf);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 12px
    }

    .stat b {
      display: block;
      font-size: 1.35rem
    }

    .stat small {
      color: var(--mu)
    }

    .badge {
      display: inline-block;
      font-size: .75rem;
      padding: 2px 8px;
      border-radius: 99px;
      background: var(--ac2);
      color: var(--ac);
      font-weight: 600
    }

    .badge.ok {
      color: var(--ok)
    }

    .badge.er {
      color: var(--er)
    }

    .badge.wa {
      color: var(--wa)
    }

    .mu {
      color: var(--mu)
    }

    .val {
      font-weight: 700;
      white-space: nowrap
    }

    .search,
    select,
    input,
    textarea {
      width: 100%;
      border: 1px solid var(--bd);
      background: var(--bg);
      color: var(--tx);
      border-radius: 9px;
      padding: 10px;
      font: inherit;
      margin-bottom: 8px
    }

    label {
      display: block;
      font-size: .85rem;
      color: var(--mu)
    }

    label input,
    label select,
    label textarea {
      margin-top: 3px;
      color: var(--tx)
    }

    .prog {
      height: 10px;
      border-radius: 9px;
      background: var(--bd);
      overflow: hidden;
      margin: 6px 0 10px
    }

    .prog i {
      display: block;
      height: 100%;
      background: var(--ok)
    }

    .modal {
      position: fixed;
      inset: 0;
      background: #0008;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 50
    }

    .modal.on {
      display: flex
    }

    .box {
      background: var(--sf);
      border-radius: 14px;
      padding: 18px;
      width: min(460px, 100%);
      max-height: 90vh;
      overflow: auto
    }

    .row {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
      margin-top: 8px
    }

    .in {
      border-left: 4px solid var(--ok)
    }

    body.out #nav {
      display: none
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    header .btn {
      min-height: 34px;
      padding: 4px 10px
    }

    .login {
      max-width: 380px;
      margin: 30px auto
    }

    .er {
      color: var(--er);
      min-height: 1.2em
    }

    .wab {
      display: inline-flex;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border-radius: 9px
    }

    .wab svg {
      width: 100%;
      height: 100%
    }

    .seg {
      display: flex;
      gap: 4px;
      background: var(--ac2);
      padding: 4px;
      border-radius: 11px;
      margin: 12px 0
    }

    .seg button {
      flex: 1;
      border: 0;
      background: none;
      color: var(--tx);
      font: inherit;
      padding: 9px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600
    }

    .seg button.on {
      background: var(--ac);
      color: #fff
    }

    .logo {
      display: none;
      align-items: center;
      justify-content: center;
      height: 64px;
      margin-bottom: 10px;
      border: 1px dashed #ffffff40;
      border-radius: 10px;
      color: var(--ni);
      font-size: .78rem;
      cursor: pointer;
      overflow: hidden;
      background: #ffffff0d;
      flex: none
    }

    .logo img {
      width: 100%;
      height: auto;
      max-height: 120px;
      object-fit: contain;
      display: block
    }

    .logo.has {
      height: auto;
      border: 0;
      background: none;
      margin-bottom: 14px
    }

    .hl {
      height: 28px;
      max-width: 120px;
      object-fit: contain;
      margin-right: 8px;
      vertical-align: middle
    }

    #st {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0
    }

    .who {
      max-width: 130px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: .9rem;
      color: var(--tx)
    }

    #br {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 0
    }

    .item>div:first-child {
      flex: 1 1 150px;
      min-width: 0;
      overflow-wrap: anywhere
    }

    .stat b {
      overflow-wrap: anywhere
    }

    input,
    select,
    textarea {
      max-width: 100%;
      min-width: 0
    }

    input[type=date],
    input[type=time] {
      min-height: 42px;
      -webkit-appearance: none;
      appearance: none
    }

    .sh {
      display: none
    }

    .dsk {
      display: none
    }

    .pals {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin: 8px 0 12px
    }

    .pal {
      display: flex;
      align-items: center;
      gap: 6px;
      border: 2px solid var(--bd);
      background: var(--sf);
      color: var(--tx);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      cursor: pointer
    }

    .pal.on {
      border-color: var(--ac)
    }

    .nvf {
      display: none
    }

    /* Optional navigation footer for theme and logo controls. */
    @media(min-width:800px) {
      #nav .nvf {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: auto;
        padding: 10px 4px 4px;
        border-top: 1px solid #ffffff1a;
        opacity: .7
      }

      #nav .nvf:hover {
        opacity: 1
      }
    }

    #nav .dots {
      display: flex;
      gap: 8px
    }

    #nav .nvf button {
      flex: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      border-radius: 50%
    }

    #nav .dot {
      width: 16px;
      height: 16px;
      border: 2px solid transparent;
      cursor: pointer
    }

    #nav .dot.sel {
      border-color: #fff
    }

    #nav .gi {
      width: 26px;
      height: 26px;
      background: none;
      border: 0;
      color: var(--ni)
    }

    #nav .gi .ic {
      width: 16px;
      height: 16px;
      margin: 0
    }

    .pal i {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-block
    }

    @media(min-width:800px) {
      .dsk {
        display: block
      }
    }

    @media(max-width:560px) {
      header small {
        display: none
      }

      .lg {
        display: none
      }

      .sh {
        display: inline
      }

      .item {
        flex-wrap: wrap
      }

      .item>.acts {
        width: 100%;
        justify-content: flex-start
      }

      #main {
        padding: 12px
      }

      .who {
        max-width: 90px
      }

      #st .badge.ok {
        display: none
      }

      #nav button {
        min-width: 0;
        font-size: .6rem;
        padding: 6px 0;
        white-space: nowrap
      }

      .stat b {
        font-size: 1.1rem
      }
    }
  </style>
</head>

<body>
  <header><span id="br">Evently<small>protótipo</small></span><span id="st"></span></header>
  <div id="main">
    <p class="mu" style="padding:20px">Carregando…</p>
  </div>
  <nav id="nav"></nav>
  <div class="modal" id="modal"></div>
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
    import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile, signOut } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
    import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, setDoc, deleteDoc, collection, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
    import { firebaseConfig } from './firebase-config.js';

    // Firebase is initialized only after the project configuration is provided.
    const OK = !!firebaseConfig.apiKey && firebaseConfig.apiKey != 'COLE_AQUI';
    const app = OK ? initializeApp(firebaseConfig) : null, auth = OK ? getAuth(app) : null, db = OK ? initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }) : null;
    let D, U = null, ready = false;

    // Helpers for JSON-encoded values in browser storage.
    const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v } catch (e) { return d } };
    const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) { } };
    const addD = n => { const d = new Date(); d.setDate(d.getDate() + n); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10) };

    // Sample records populate the demo and the dashboard's restore action.
    function seed() {
      return {
        clients: [{ id: 'c1', nome: 'Marina e Rafael', tel: '(14) 99999-0001', email: 'marina@exemplo.com', obs: '' }, { id: 'c2', nome: 'Empresa Alfa', tel: '(14) 3333-0002', email: 'rh@alfa.com', obs: 'Confraternização anual' }],
        suppliers: [{ id: 's1', nome: 'Buffet Sabor & Arte', cat: 'Buffet', tel: '(14) 98888-0003', email: '', obs: '' }, { id: 's2', nome: 'Foto Momento', cat: 'Fotografia', tel: '(14) 98888-0004', email: '', obs: '' }, { id: 's3', nome: 'DJ Beat', cat: 'Música/DJ', tel: '', email: '', obs: '' }],
        events: [{ id: 'e1', nome: 'Casamento Marina e Rafael', tipo: 'Casamento', data: addD(12), hora: '18:00', local: 'Chácara Bela Vista', cli: 'c1', status: 'Confirmado', orc: 45000, obs: 'Cerimônia ao ar livre', sup: [{ id: 'x1', forn: 's1', serv: 'Jantar para 120', valor: 18000, conf: '1' }, { id: 'x2', forn: 's2', serv: 'Foto e vídeo', valor: 4500, conf: '0' }] },
        { id: 'e2', nome: 'Confraternização Alfa', tipo: 'Corporativo', data: addD(40), hora: '20:00', local: 'Salão Central', cli: 'c2', status: 'Planejamento', orc: 15000, obs: '', sup: [] }],
        costs: [{ id: 'k1', desc: 'Sinal do buffet', ev: 'e1', forn: 's1', cat: 'Buffet', valor: 12000, venc: addD(-2), pago: '0' }, { id: 'k2', desc: 'Fotografia', ev: 'e1', forn: 's2', cat: 'Fotografia', valor: 4500, venc: addD(5), pago: '0' }, { id: 'k3', desc: 'Reserva do salão', ev: 'e2', forn: '', cat: 'Espaço', valor: 3000, venc: addD(15), pago: '1' }],
        receipts: [{ id: 'r1', cli: 'c1', ev: 'e1', desc: 'Honorários de cerimonial — 1ª parcela', valor: 3000, forma: 'PIX', data: addD(-1), pago: '1', pagoEm: addD(-1) }, { id: 'r2', cli: 'c1', ev: 'e1', desc: 'Honorários de cerimonial — saldo', valor: 3000, forma: 'Transferência', data: addD(10), pago: '0' }, { id: 'r3', cli: 'c2', ev: 'e2', desc: 'Honorários de cerimonial', valor: 2500, forma: 'Boleto', data: addD(20), pago: '0' }], guests: [{ id: 'g1', ev: 'e1', nome: 'Ana Souza', mesa: '1', comps: [{ n: 'Paulo Souza', in: '' }], tel: '', obs: '', in: '' }, { id: 'g2', ev: 'e1', nome: 'Carlos Lima', mesa: '1', acomp: 0, tel: '', obs: '', in: '' }, { id: 'g3', ev: 'e1', nome: 'Beatriz Rocha', mesa: '2', comps: [{ n: 'Lucas Rocha', in: '' }, { n: 'Julia Rocha', in: '' }], tel: '', obs: '', in: '' }]
      }
    }

    // Firestore synchronization keeps a local snapshot for change detection.
    const KINDS = ['clients', 'suppliers', 'events', 'costs', 'receipts', 'guests'];
    let LAST = {}, UNS = [];

    // Remove UI-only flags before comparing or persisting records.
    const strip = o => { const c = Object.assign({}, o); delete c.dirty; return JSON.parse(JSON.stringify(c)) };
    // Unsubscribe before changing accounts to prevent stale updates.
    function stopSync() { UNS.forEach(f => f()); UNS = []; ready = false }
    function startSync() {
      D = { clients: [], suppliers: [], events: [], costs: [], receipts: [], guests: [], logo: '', pal: '' }; LAST = {}; ready = false;
      const base = 'accounts/' + U.id;
      UNS.push(onSnapshot(doc(db, base), { includeMetadataChanges: true }, s => {
        const m = s.data() || {}, j = JSON.stringify({ logo: m.logo || '', pal: m.pal || '' });
        if (!ready || j != LAST.meta) { D.logo = m.logo || ''; D.pal = m.pal || ''; LAST.meta = j; ready = true; render() }
      }));
      KINDS.forEach(k => {
        LAST[k] = {}; UNS.push(onSnapshot(collection(db, base + '/' + k), { includeMetadataChanges: true }, s => {
          const arr = s.docs.map(d => { const x = d.data(); if (k == 'guests' && d.metadata.hasPendingWrites) x.dirty = 1; return x });
          LAST[k] = {}; arr.forEach(x => { LAST[k][x.id] = JSON.stringify(strip(x)) });
          if (JSON.stringify(arr) != JSON.stringify(D[k])) { D[k] = arr; render() }
        }))
      });
    }
    // Persist changed records and delete documents removed from the local data set.
    function save() {
      if (!U || !D || !ready) return; const base = 'accounts/' + U.id;
      KINDS.forEach(k => {
        const old = LAST[k] || (LAST[k] = {}), seen = {};
        D[k].forEach(x => { const o = strip(x), j = JSON.stringify(o); seen[x.id] = 1; if (old[x.id] !== j) { old[x.id] = j; setDoc(doc(db, base + '/' + k, x.id), o).catch(console.error) } });
        Object.keys(old).forEach(id => { if (!seen[id]) { delete old[id]; deleteDoc(doc(db, base + '/' + k, id)).catch(console.error) } })
      });
      const m = { logo: D.logo || '', pal: D.pal || '' }, j = JSON.stringify(m);
      if (j != LAST.meta) { LAST.meta = j; setDoc(doc(db, base), m, { merge: true }).catch(console.error) }
    }

    // Formatting, DOM, and guest-count helpers shared by the views.
    const uid = () => Math.random().toString(36).slice(2, 9);
    const $ = s => document.querySelector(s);
    const brl = n => (+n || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    const fd = d => d ? d.split('-').reverse().join('/') : '—';
    const days = d => Math.round((new Date(d + 'T00:00') - new Date(addD(0) + 'T00:00')) / 864e5);
    const rel = n => n < 0 ? 'há ' + (-n) + ' dia(s)' : n == 0 ? 'hoje' : n == 1 ? 'amanhã' : 'em ' + n + ' dias';
    const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const byId = (a, id) => D[a].find(x => x.id == id) || {};
    const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);

    // Inline SVG paths used by the navigation and action buttons.

      empresa() {
        const L = D.receipts.slice().sort((a, b) => ((a.pago == '1') - (b.pago == '1')) || (a.data || '9').localeCompare(b.data || '9')), pd = L.filter(r => r.pago != '1'), late = pd.filter(r => r.data && days(r.data) < 0);
        return `${hdr('A receber dos clientes', 'receipts', 'Novo recebimento')}<p class="mu">Pagamentos dos clientes à cerimonialista (honorários).</p><div class="grid"><div class="stat"><b style="color:var(--wa)">${brl(sum(pd, r => r.valor))}</b><small>a receber</small></div><div class="stat"><b style="color:var(--er)">${late.length}</b><small>em atraso</small></div><div class="stat"><b style="color:var(--ok)">${brl(sum(L.filter(r => r.pago == '1'), r => r.valor))}</b><small>já recebido</small></div></div>` + (L.map(r => { const s = r.pago == '1' ? ['Recebido', 'ok'] : r.data && days(r.data) < 0 ? ['Atrasado', 'er'] : ['Pendente', 'wa'], en = byId('events', r.ev).nome; return `<div class="item"><div><b>${esc(byId('clients', r.cli).nome || '(sem cliente)')}</b><small>${esc(r.desc)}${en ? ' · ' + esc(en) : ''}</small><small>${esc(r.forma)} · combinado para ${fd(r.data)}${r.pago == '1' && r.pagoEm ? ' · recebido em ' + fd(r.pagoEm) : ''}</small><span class="badge ${s[1]}">${s[0]}</span></div><div class="acts" style="align-items:center"><span class="val">${brl(r.valor)}</span><button class="btn" data-a="recv" data-i="${r.id}">${r.pago == '1' ? 'Desfazer' : 'Receber'}</button><button class="btn" data-a="edit" data-i="receipts" data-j="${r.id}">Editar</button><button class="btn dng" data-a="del" data-i="receipts" data-j="${r.id}">✕</button></div></div>` }).join('') || empty)
      },
      evFin() {
        const L = D.costs.filter(c => !S.fev || c.ev == S.fev).sort((a, b) => (a.venc || '9').localeCompare(b.venc || '9')), t = sum(L, c => c.valor), pg = sum(L.filter(c => c.pago == '1'), c => c.valor);
        return `${hdr('Custos dos eventos', 'costs', 'Novo custo')}<select data-a="fev"><option value="">Todos os eventos</option>${D.events.map(e => `<option value="${e.id}" ${e.id == S.fev ? 'selected' : ''}>${esc(e.nome)}</option>`).join('')}</select>
 <div class="grid"><div class="stat"><b>${brl(t)}</b><small>total</small></div><div class="stat"><b style="color:var(--ok)">${brl(pg)}</b><small>pago</small></div><div class="stat"><b style="color:var(--wa)">${brl(t - pg)}</b><small>a pagar</small></div></div>
 ${L.map(c => { const s = costState(c); return `<div class="item"><div><b>${esc(c.desc)}</b><small>${esc(byId('events', c.ev).nome || '—')} · ${esc(byId('suppliers', c.forn).nome || c.cat || '')} · vence ${fd(c.venc)}</small><span class="badge ${s[1]}">${s[0]}</span></div><div class="acts" style="align-items:center"><span class="val">${brl(c.valor)}</span><button class="btn" data-a="pay" data-i="${c.id}">${c.pago == '1' ? '↩' : 'Pagar'}</button><button class="btn" data-a="edit" data-i="costs" data-j="${c.id}">✎</button></div></div>` }).join('') || empty}`
      },
      clientes: () => list('clients', x => [x.tel, x.email, D.events.filter(e => e.cli == x.id).length + ' evento(s)'].filter(Boolean).map(esc).join(' · ')),
      fornecedores: () => list('suppliers', x => [x.cat, x.tel, x.email].filter(Boolean).map(esc).join(' · '))
    };
    const ev = () => byId('events', S.ev);

    // UI actions are dispatched from data-a attributes in the rendered markup.
    const A = {
      tab(i) { S.tab = i; S.ev = null; S.q = '' }, openev(i) { S.tab = 'eventos'; S.ev = i }, back() { S.ev = null },
      add(k) { upsert(k, null, k == 'costs' && S.ev ? { ev: S.ev } : null) }, edit(k, id) { upsert(k, id) }, del(k, id) { remove(k, id) },
      addsup() { upsert('sup', null, null, ev().sup) }, editsup(i) { upsert('sup', i, null, ev().sup) },
      togsup(i) { const s = ev().sup.find(x => x.id == i); s.conf = s.conf == '1' ? '0' : '1'; save() },
      rmsup(i) { ask('Remover fornecedor do evento?', () => { ev().sup = ev().sup.filter(x => x.id != i) }) },
      finev() { S.fin = 'eventos'; S.fev = S.ev; S.tab = 'financeiro'; S.ev = null }, checkin() { S.gev = S.ev; S.tab = 'convidados'; S.ev = null; S.q = '' },
      tog(i) { const g = byId('guests', i); if (np(g) == tp(g)) { g.in = ''; (g.comps || []).forEach(c => c.in = '') } else { const h = nowT(); g.in = g.in || h; (g.comps || []).forEach(c => c.in = c.in || h) } g.dirty = 1; save() },
      tit(i) { const g = byId('guests', i); g.in = g.in ? '' : nowT(); g.dirty = 1; save() },
      cmp(i, j) { const g = byId('guests', i), c = g.comps[j]; c.in = c.in ? '' : nowT(); g.dirty = 1; save() },
      logo() { logoModal() },
      fin(i) { S.fin = i },
      pal(i) { D.pal = i; save() },
      recv(i) { const r = byId('receipts', i); r.pago = r.pago == '1' ? '0' : '1'; r.pagoEm = r.pago == '1' ? addD(0) : ''; save() },

      sair() { signOut(auth) },
      pay(i) { const c = byId('costs', i); c.pago = c.pago == '1' ? '0' : '1'; save() },
      addg() { upsert('guests', null, { ev: S.gev }) },
      bulk() { form('Colar lista de convidados', [{ k: 'lista', l: 'Um nome por linha (opcional: Nome;Mesa)', t: 'textarea' }], {}, o => { o.lista.split('\n').map(l => l.trim()).filter(Boolean).forEach(l => { const p = l.split(';'); D.guests.push({ id: uid(), ev: S.gev, nome: p[0].trim(), mesa: (p[1] || '').trim(), comps: [], tel: '', obs: '', in: '', dirty: 1 }) }) }) },
      reset() { ask('Substituir tudo pelos dados de exemplo?', () => { const m = { logo: D.logo, pal: D.pal }; D = Object.assign(seed(), m) }) },
      clear() { ask('Apagar todos os dados? Não dá para desfazer.', () => { const m = { logo: D.logo, pal: D.pal }; D = Object.assign({ clients: [], suppliers: [], events: [], costs: [], receipts: [], guests: [] }, m) }) }
    };
    function render() {
      if (!U) { showLogin('in'); return }
      if (!ready) { $('#main').innerHTML = '<p class="mu">Carregando…</p>'; return }
      document.body.classList.remove('out'); mig(); pal();
      $('#nav').innerHTML = `<div class="logo${D.logo ? ' has' : ''}" data-a="logo">${D.logo ? `<img src="${D.logo}" alt="Logo">` : 'Seu logo aqui'}</div>` + NAV.map(n => `<button class="${S.tab == n[0] ? 'on' : ''}" data-a="tab" data-i="${n[0]}">${ico(n[0])}${n[0] == 'fornecedores' ? '<span class="lg">Fornecedores</span><span class="sh">Fornec.</span>' : n[2]}</button>`).join('') + nvFoot();
      $('#main').innerHTML = V[S.tab](); status(); brand();
    }

    // Delegated listeners remain active while the inner application markup changes.
    document.addEventListener('click', e => { const b = e.target.closest('button[data-a],.item[data-a],.logo[data-a]'); if (!b || !A[b.dataset.a]) return; A[b.dataset.a](b.dataset.i, b.dataset.j); render() });
    document.addEventListener('change', e => { const a = e.target.dataset.a; if (a == 'gev' || a == 'fev') { S[a] = e.target.value; render() } });
    document.addEventListener('input', e => { if (e.target.dataset.a != 'q') return; S.q = e.target.value; render(); const i = $('.search'); i.focus(); i.setSelectionRange(S.q.length, S.q.length) });
    function status() { const on = navigator.onLine, n = D ? D.guests.filter(g => g.dirty).length : 0; $('#st').innerHTML = U ? `<b class="who">${esc(U.nome)}</b><span class="badge ${on ? 'ok' : 'wa'}">${on ? 'Online' : 'Offline'}${n ? ' · ' + n + ' a sincronizar' : ''}</span> <button class="btn" data-a="sair">Sair</button>` : '' }

    // Authentication messages are mapped to user-friendly Portuguese text.
    const AUTHERR = { 'auth/invalid-credential': 'E-mail ou senha incorretos.', 'auth/user-not-found': 'E-mail ou senha incorretos.', 'auth/wrong-password': 'E-mail ou senha incorretos.', 'auth/email-already-in-use': 'Este e-mail já tem conta.', 'auth/weak-password': 'Senha fraca. Use 6 ou mais caracteres.', 'auth/invalid-email': 'E-mail inválido.', 'auth/network-request-failed': 'Sem internet. Conecte-se para entrar.', 'auth/too-many-requests': 'Muitas tentativas. Aguarde um pouco.' };
    function showLogin(mode) {
      document.body.classList.add('out'); $('#st').innerHTML = ''; brand(); pal(); $('#nav').innerHTML = ''; const nw = mode == 'new';
      $('#main').innerHTML = `<div class="card login"><h2>${nw ? 'Criar conta' : 'Entrar'}</h2><p class="mu">${nw ? 'Cada cerimonialista tem sua própria conta e seus próprios dados.' : 'Acesse sua conta de cerimonialista.'}</p>${nw ? '<label>Seu nome<input id="ln" autocomplete="name"></label>' : ''}<label>E-mail<input id="le" type="email" autocomplete="username"></label><label>Senha<input id="lp" type="password" autocomplete="${nw ? 'new-password' : 'current-password'}"></label><p class="er" id="lm"></p><button class="btn pri" id="lgo" style="width:100%">${nw ? 'Criar conta' : 'Entrar'}</button><p style="text-align:center"><button class="btn" id="lsw">${nw ? 'Já tenho conta' : 'Criar uma conta'}</button></p></div>`;
      $('#lsw').onclick = () => showLogin(nw ? 'in' : 'new');
      $('#lgo').onclick = async () => {
        const m = $('#lm'), e = $('#le').value.trim().toLowerCase(), p = $('#lp').value, n = nw ? $('#ln').value.trim() : '';
        if (!e || p.length < 6 || (nw && !n)) { m.textContent = 'Preencha todos os campos (senha com 6 ou mais caracteres).'; return }
        m.textContent = ''; $('#lgo').disabled = true;
        try { if (nw) { const c = await createUserWithEmailAndPassword(auth, e, p); await updateProfile(c.user, { displayName: n }); if (U) { U.nome = n; render() } } else await signInWithEmailAndPassword(auth, e, p) }
        catch (x) { m.textContent = AUTHERR[x.code] || 'Não foi possível entrar. Tente novamente.'; $('#lgo').disabled = false }
      }
    }
    window.addEventListener('online', () => { save(); render() }); window.addEventListener('offline', status); matchMedia('(prefers-color-scheme: dark)').addEventListener('change', pal);

    // Start the authenticated data listeners, or explain missing Firebase setup.
    if (OK) onAuthStateChanged(auth, u => { stopSync(); if (u) { U = { id: u.uid, nome: u.displayName || u.email.split('@')[0], email: u.email }; S.tab = 'painel'; S.ev = null; startSync() } else { U = null; D = null; render() } });
    else $('#main').innerHTML = '<div class="card login"><h2>Configuração pendente</h2><p class="mu">Preencha o arquivo firebase-config.js com os dados do seu projeto Firebase. Consulte a seção "Configuração do Firebase" no README.md.</p></div>';
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => { });
  </script>
</body>

</html>
